<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>월하 · 연애·인연 사주</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" id="brand-home"><span class="logo">🌙</span> 월하 <span class="ver">月下</span></button>
    </header>

    <main class="stage">
      <!-- 홈: 서비스 메뉴 -->
      <section id="view-home" class="view">
        <p class="lead">헤어진 그 사람, 다시 이어질까?<br />달빛 아래에서 <b>재회운</b>과 연애 인연을 다정하게 풀어드려요.</p>
        <div class="menu">
          <button class="svc-card hero" data-service="jaehoe">
            <span class="hero-badge">대표 · 연애운</span>
            <span class="svc-emoji">🕯️</span>
            <span class="svc-text"><b>재회 가능성</b><small>헤어진 그 사람과 다시 이어질 수 있을까 — 재회운과 유리한 시기까지</small><span class="hero-hook">⏱ 3분이면 확인 · 생년월일만 있으면 OK</span></span>
            <span class="svc-arrow">›</span>
          </button>
          <div class="menu-sub">그 밖의 인연 보기</div>
          <button class="svc-card" data-service="gunghap">
            <span class="svc-emoji">💞</span>
            <span class="svc-text"><b>연인 궁합</b><small>지금 그 사람과 얼마나 잘 맞을까</small></span>
            <span class="svc-arrow">›</span>
          </button>
          <button class="svc-card" data-service="saju">
            <span class="svc-emoji">🔮</span>
            <span class="svc-text"><b>사주 풀이</b><small>나의 타고난 기질과 삶의 흐름</small></span>
            <span class="svc-arrow">›</span>
          </button>
        </div>
      </section>

      <!-- 사주 풀이 (1인) -->
      <section id="view-saju" class="view" hidden>
        <button class="back" data-home>← 홈으로</button>
        <h2 class="view-title">🔮 사주 풀이</h2>
        <section class="panel">
          <form id="form-saju">
            <div data-person="s"></div>
            <button type="submit" class="submit-btn">사주 보기</button>
          </form>
        </section>
      </section>

      <!-- 연인 궁합 / 재회 가능성 (2인) -->
      <section id="view-couple" class="view" hidden>
        <button class="back" data-home>← 홈으로</button>
        <h2 class="view-title" id="couple-title">💞 연인 궁합</h2>
        <p class="view-desc" id="couple-desc"></p>
        <section class="panel">
          <form id="form-couple">
            <div class="person-block" data-person="a"></div>
            <div class="heart-divider"><span id="couple-heart">💞</span></div>
            <div class="person-block" data-person="b"></div>
            <button type="submit" class="submit-btn" id="couple-submit">궁합 보기</button>
          </form>
        </section>
      </section>

      <!-- 결과 (공용) -->
      <section class="panel result-panel" id="chart-panel" hidden>
        <div class="panel-head">
          <h2 id="chart-title">사주 원국</h2>
          <button type="button" class="ghost" data-home>다시</button>
        </div>
        <div id="chart"></div>
      </section>

      <section class="panel result-panel reading-panel" id="reading-panel" hidden>
        <div class="panel-head">
          <h2><span class="logo">🌙</span> 월하의 풀이</h2>
        </div>
        <div class="status" id="reading-status"></div>
        <div class="reading" id="reading"></div>
      </section>

      <footer class="foot">
        사주는 정해진 운명이 아니라, 타고난 기질과 흐름을 참고하는 재미로 봐 주세요. 🌿
        <div class="foot-links"><a href="/policy.html" target="_blank">이용약관·환불·개인정보</a></div>
      </footer>
    </main>
  </div>

  <!-- 구독 안내(페이월) 모달 -->
  <div class="modal-overlay" id="paywall" hidden>
    <div class="modal">
      <button class="modal-x" id="paywall-close" aria-label="닫기">✕</button>
      <div class="modal-emoji">🌙</div>
      <h3 class="modal-title">구독하고 풀이 받기</h3>
      <p class="modal-desc">사주 명식·궁합 점수는 <b>무료</b>예요.<br />월하의 <b>AI 풀이</b>는 구독자 전용이랍니다.</p>
      <button class="modal-btn primary" id="paywall-subscribe">구독하기</button>
      <div class="modal-divider"><span>이미 구독하셨나요?</span></div>
      <div class="license-row">
        <input type="text" id="license-input" placeholder="라이선스 키 (이메일로 받은 키)" autocomplete="off" />
        <button class="modal-btn" id="license-check">확인</button>
      </div>
      <div class="license-msg" id="license-msg"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
